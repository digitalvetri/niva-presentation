<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MERIDIAN · A World of Healthcare Without Borders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --gold:#d4af6a; --gold2:#f2d9a2; --gold3:#a8793a; --ink:#07060a; --txt:#efe8dc; --mut:#b4aa98; --dim:#827a6c;
  --glass:linear-gradient(160deg, rgba(46,36,22,.62), rgba(14,11,8,.72));
  --line:rgba(212,175,106,.30);
  --ease:cubic-bezier(.2,.75,.15,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050407;color:var(--txt);font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.65) 100%),
             linear-gradient(180deg, rgba(0,0,0,.25), transparent 18%, transparent 80%, rgba(0,0,0,.45));}
#frame{position:fixed;inset:18px;border:1px solid rgba(212,175,106,.16);pointer-events:none;z-index:2;border-radius:2px}
#stageWrap{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.scene{position:absolute;inset:0;visibility:hidden}
.scene.active,.scene.out{visibility:visible}
.ia,.ia *{pointer-events:auto}

/* reveal */
.rv{opacity:0;transform:translate3d(0,34px,0) rotateX(14deg);filter:blur(10px);transform-origin:50% 100%;
  transition:opacity .9s var(--ease), transform 1.1s var(--ease), filter .9s var(--ease);transition-delay:0s}
.scene.active .rv{opacity:1;transform:none;filter:blur(0);transition-delay:calc(var(--d,0) * 1s + .45s)}
.scene.out .rv{opacity:0;transform:translate3d(0,-18px,0);filter:blur(6px);transition-duration:.45s;transition-delay:0s}
.rv.l{transform:translate3d(-60px,0,0) rotateY(18deg)}
.rv.r{transform:translate3d(60px,0,0) rotateY(-18deg)}
.rv.z{transform:scale(.86) translateZ(-80px)}
.persp{perspective:1400px}

/* type */
.eyebrow{font-size:15px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:18px}
.eyebrow:before{content:"";width:46px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
h2{font-weight:600;font-size:58px;line-height:1.12;letter-spacing:-.01em;margin-top:22px;color:#fbf6ee;text-shadow:0 4px 30px rgba(0,0,0,.6)}
h2.s{font-size:48px}
.g{background:linear-gradient(100deg,#b8873c 0%,#f6dfa8 30%,#d3a556 52%,#f3d797 75%,#b8873c 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
@keyframes sheen{to{background-position:-220% 0}}
p.lead{font-size:24px;line-height:1.6;color:#d9d0c1;margin-top:26px;font-weight:400}
p.body{font-size:20px;line-height:1.6;color:var(--mut);margin-top:18px}
.gold{color:var(--gold2)}
.fn{position:absolute;left:130px;right:130px;bottom:62px;font-size:14px;line-height:1.5;color:var(--dim);letter-spacing:.01em}
.serif{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500}

/* cards */
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,232,190,.08), 0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card:before{content:"";position:absolute;left:12%;right:12%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,222,160,.9),transparent)}
.card.hot{border-color:rgba(232,196,128,.6);background:linear-gradient(160deg, rgba(92,68,32,.6), rgba(26,19,10,.75))}
.ic{width:30px;height:30px;color:var(--gold2);flex:none}
.icb{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%, rgba(255,220,150,.22), rgba(60,42,18,.35) 70%);border:1px solid rgba(232,196,128,.5);
  box-shadow:0 0 24px rgba(212,160,80,.25), inset 0 0 12px rgba(255,210,140,.12)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border-radius:40px;border:1px solid var(--line);
  background:rgba(30,24,15,.55);font-size:17px;color:#e9dfcd;backdrop-filter:blur(8px)}
.chip .ic{width:20px;height:20px}
.tag{display:inline-block;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#1c1408;background:linear-gradient(100deg,#c99a4e,#f3d797);padding:5px 12px;border-radius:30px;font-weight:600}
.tag.o{background:transparent;color:var(--gold2);border:1px solid var(--line)}

/* title scene */
.mark{font-weight:200;font-size:116px;letter-spacing:.32em;color:#f3e6cc;line-height:1;display:flex;align-items:flex-end;text-shadow:0 0 40px rgba(212,175,106,.35)}
.mark .lam{flex:none;width:.62em;height:.86em;margin:0 .32em 0 0;color:#f3e6cc;stroke-width:3.6}
.rule{height:1px;width:420px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* tables */
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:19px}
table.t th{font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#1b1309;padding:16px 14px;text-align:center}
table.t thead th{background:linear-gradient(180deg,#d9b46d,#b88b42)}
table.t thead th:first-child{text-align:left;border-radius:12px 0 0 0;background:linear-gradient(180deg,#c9a35d,#a07434)}
table.t thead th:last-child{border-radius:0 12px 0 0;background:linear-gradient(180deg,#f4dca4,#d8b06a)}
table.t td{padding:14px;text-align:center;color:#e9e1d2;border-bottom:1px solid rgba(212,175,106,.14);background:rgba(16,13,9,.62)}
table.t td:first-child{text-align:left;color:#f6efe2;font-weight:500}
table.t td small{display:block;font-size:13px;color:var(--dim);font-weight:400;margin-top:3px}
table.t tr:last-child td:first-child{border-radius:0 0 0 12px} table.t tr:last-child td:last-child{border-radius:0 0 12px 0}
table.t td.no{color:#7a6f62} table.t td.full{color:var(--gold2);font-weight:600}
table.t td.u{background:rgba(70,52,22,.5)}
table.t tbody tr{transition:background .3s}
table.t tbody tr:hover td{background:rgba(60,45,22,.7)}

/* labels from 3D */
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform,opacity;opacity:0}
.lbl.beacon{transform-origin:0 100%}
.lbl.beacon .in{padding:8px 14px 8px 12px;border-left:2px solid var(--gold);background:linear-gradient(90deg,rgba(30,22,10,.82),rgba(30,22,10,0));}
.lbl.beacon b{display:block;font-size:24px;font-weight:600;color:#fff2d6;letter-spacing:.01em}
.lbl.beacon span{display:block;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.lbl.pil{text-align:center}
.lbl.pil b{display:block;font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600}
.lbl.pil span{display:block;font-size:30px;font-weight:600;color:#fff4dc;margin-top:4px;text-shadow:0 2px 20px rgba(0,0,0,.8)}
.lbl.pil span.inf{font-size:38px}
.lbl.pil span.no{font-size:18px;color:#857a6a;font-weight:500}
.lbl.node{text-align:center}
.lbl.node b{display:block;font-size:44px;font-weight:600;color:#fff1d2;letter-spacing:.02em}
.lbl.node span{display:block;font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.lbl.svc{font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#f8e3b6;font-weight:600;text-shadow:0 0 18px rgba(0,0,0,.9)}

/* brand + UI */
#brand{position:fixed;top:40px;right:52px;z-index:5;text-align:right;pointer-events:none;transition:opacity .6s}
#brand .w{font-weight:300;letter-spacing:.42em;font-size:17px;color:#f0e2c4;display:flex;align-items:flex-end;justify-content:flex-end}
#brand .w .lam{flex:none;width:.6em;height:.82em;margin-right:.42em;stroke-width:4}
#brand .s{font-size:10.5px;letter-spacing:.3em;color:var(--gold);margin-top:6px;text-transform:uppercase;margin-right:.42em}
#chapter{position:fixed;top:44px;left:52px;z-index:5;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);pointer-events:none;transition:opacity .6s}
#chapter i{font-style:normal;color:#7d7363;margin-right:12px}
#progress{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:6;background:rgba(212,175,106,.08)}
#progress .bar{height:100%;width:0;background:linear-gradient(90deg,#8a6125,#f2d9a2);box-shadow:0 0 14px rgba(242,217,162,.7);transition:width 1.2s var(--ease)}
#nav{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:6px;padding:8px 10px;
  border-radius:40px;background:rgba(18,14,9,.72);border:1px solid rgba(212,175,106,.22);backdrop-filter:blur(14px);transition:opacity .5s, transform .5s}
#nav.hide{opacity:0;transform:translateX(-50%) translateY(14px);pointer-events:none}
#nav button{all:unset;cursor:pointer;height:36px;min-width:36px;padding:0 12px;border-radius:30px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#e9dcc3;transition:background .25s,color .25s}
#nav button:hover,#nav button.on{background:rgba(212,175,106,.18);color:#fff}
#nav button svg{width:18px;height:18px}
#nav .cnt{font-size:13px;letter-spacing:.14em;color:#bfb29a;padding:0 12px;font-variant-numeric:tabular-nums}
#nav .sep{width:1px;height:20px;background:rgba(212,175,106,.25);margin:0 4px}

#notes{position:fixed;left:40px;bottom:90px;width:560px;z-index:8;padding:22px 26px;border-radius:16px;background:rgba(14,11,7,.9);border:1px solid rgba(212,175,106,.35);
  font-size:16px;line-height:1.6;color:#e8dfcf;opacity:0;transform:translateY(10px);pointer-events:none;transition:.4s}
#notes.on{opacity:1;transform:none;pointer-events:auto}
#notes h4{font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;font-weight:600}
#notes ul{padding-left:18px} #notes li{margin:5px 0}

#overview{position:fixed;inset:0;z-index:9;background:rgba(6,5,4,.92);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .45s;overflow:auto;padding:70px 80px}
#overview.on{opacity:1;pointer-events:auto}
#overview h3{font-weight:300;letter-spacing:.4em;font-size:22px;color:#f2e4c6;margin-bottom:34px}
#overview .ch{margin-bottom:28px}
#overview .ch h5{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;font-weight:600}
#overview .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
#overview .it{all:unset;cursor:pointer;padding:16px 18px;border-radius:12px;border:1px solid rgba(212,175,106,.2);background:rgba(30,24,15,.5);font-size:15px;color:#e8dcc5;transition:.25s;display:flex;gap:12px}
#overview .it i{font-style:normal;color:var(--gold);font-variant-numeric:tabular-nums}
#overview .it:hover,#overview .it.cur{border-color:var(--gold);background:rgba(70,52,22,.55)}

#help{position:fixed;right:40px;bottom:90px;z-index:8;font-size:13px;color:#a99e8a;line-height:1.9;padding:18px 22px;border-radius:14px;background:rgba(14,11,7,.9);border:1px solid rgba(212,175,106,.3);opacity:0;pointer-events:none;transition:.4s}
#help.on{opacity:1}
#help kbd{display:inline-block;min-width:24px;padding:1px 7px;margin-right:8px;border:1px solid rgba(212,175,106,.4);border-radius:5px;color:#f0e2c4;font-family:inherit;font-size:12px;text-align:center}

#loader{position:fixed;inset:0;z-index:20;background:#050407;display:grid;place-items:center;transition:opacity 1.2s .2s}
#loader.done{opacity:0;pointer-events:none}
#loader .w{font-weight:200;letter-spacing:.5em;font-size:34px;color:#e9d6ae;display:flex;align-items:flex-end}
#loader .w .lam{width:.6em;height:.85em;margin-right:.5em;stroke-width:3.5}
#loader .b{width:220px;height:1px;background:rgba(212,175,106,.2);margin:26px auto 0;overflow:hidden}
#loader .b:after{content:"";display:block;height:100%;width:40%;background:var(--gold);animation:ld 1.2s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* ---------- scene-specific ---------- */
.L{position:absolute;left:130px;top:140px;width:780px}
.T{position:absolute;left:130px;top:110px;right:130px}
.num{font-weight:200;font-size:150px;line-height:.9;color:transparent;-webkit-text-stroke:1.2px rgba(232,196,128,.75);letter-spacing:.02em}
.stat b{display:block;font-weight:600;font-size:76px;line-height:1;letter-spacing:-.01em}
.stat > span{display:block;font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-top:12px}
.row{display:flex;gap:22px}
.col{display:flex;flex-direction:column}

.persona{width:378px;height:420px;padding:34px 30px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.persona .big{position:absolute;right:-30px;top:-20px;width:230px;height:230px;color:rgba(232,196,128,.10)}
.persona .big .ic{width:100%;height:100%;stroke-width:.6;color:rgba(232,196,128,.08)}
.persona h4{font-size:27px;line-height:1.3;font-weight:600;color:#fbf2df;margin-top:22px}
.persona .k{font-size:13px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}

.cmp{display:grid;grid-template-columns:1fr 70px 1fr;gap:0;align-items:stretch}
.cmp .hd{padding:20px 28px;font-weight:600;font-size:20px;border-radius:18px 18px 0 0}
.cmp .hd.a{background:linear-gradient(180deg,rgba(80,74,66,.6),rgba(38,35,31,.7));color:#ddd5c8;border:1px solid rgba(200,190,175,.25);border-bottom:none}
.cmp .hd.b{background:linear-gradient(180deg,#e2bd76,#b98b42);color:#1b1208}
.cmp .c{padding:19px 28px;font-size:20px;display:flex;align-items:center;min-height:74px}
.cmp .c.a{color:#a59d90;background:rgba(28,26,24,.72);border-left:1px solid rgba(200,190,175,.18);border-right:1px solid rgba(200,190,175,.18);border-bottom:1px solid rgba(200,190,175,.10)}
.cmp .c.b{color:#f6ecd8;background:rgba(48,36,18,.72);border-left:1px solid rgba(232,196,128,.4);border-right:1px solid rgba(232,196,128,.4);border-bottom:1px solid rgba(232,196,128,.14)}
.cmp .ar{display:grid;place-items:center}
.cmp .ar i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#3a2c16,#120d07);border:1px solid rgba(232,196,128,.6);color:var(--gold2);box-shadow:0 0 18px rgba(212,160,80,.35)}
.cmp .ar i svg{width:18px;height:18px}

.aitem{display:flex;gap:26px;align-items:center;padding:26px 30px;margin-bottom:22px;width:470px}
.aitem .n{font-size:15px;letter-spacing:.2em;color:var(--gold);font-weight:600}
.aitem h4{font-size:34px;font-weight:600;color:#fff3dc;line-height:1.1;margin:6px 0 6px}
.aitem p{font-size:17px;color:var(--mut)}

.reg{display:grid;grid-template-columns:1fr auto;gap:2px 30px;width:520px;margin-top:40px}
.reg div{padding:13px 0;border-bottom:1px solid rgba(212,175,106,.16);font-size:19px}
.reg .v{text-align:right;font-weight:600;color:var(--gold2);font-variant-numeric:tabular-nums}

.opt{padding:28px 30px;width:640px;margin-top:22px;cursor:pointer;transition:transform .5s var(--ease), border-color .4s, background .4s, opacity .5s}
.opt .k{font-size:13px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;font-weight:600}
.opt h4{font-size:32px;font-weight:600;margin:8px 0 8px;color:#fff3dc}
.opt p{font-size:18px;color:var(--mut)}
.opt.sel{border-color:rgba(242,214,150,.85);background:linear-gradient(160deg, rgba(96,72,34,.66), rgba(30,22,11,.78));transform:translateX(16px)}
.opt:not(.sel){opacity:.62}

.prt{display:grid;grid-template-columns:230px 1fr 230px;gap:30px;align-items:center;padding:24px 30px;margin-top:18px;width:1120px;min-height:128px}
.prt .st{text-align:right;border-left:1px solid rgba(212,175,106,.2);padding-left:20px}
.prt .st small{display:block;font-size:13px;color:var(--mut);letter-spacing:.06em;margin-top:4px}
.prt .w{font-size:13px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase;font-weight:600}
.prt .w b{display:block;font-size:24px;letter-spacing:0;text-transform:none;color:#fff3dc;margin-top:6px}
.prt h4{font-size:26px;font-weight:600;color:var(--gold2)}
.prt p{font-size:17px;color:var(--mut);margin-top:4px;line-height:1.5}
.prt .bn{font-size:38px;font-weight:600;white-space:nowrap}

.tile{padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.tile h5{font-size:21px;font-weight:600;color:#fbf1dc;line-height:1.25}
.tile p{font-size:15.5px;color:var(--mut);line-height:1.45}

.stepc{padding:34px 32px;width:520px}
.stepc .k{display:flex;align-items:center;gap:14px;font-size:14px;letter-spacing:.32em;color:var(--gold);font-weight:600}
.stepc .k b{font-size:34px;font-weight:200;color:var(--gold2);letter-spacing:0}
.stepc h4{font-size:30px;font-weight:600;color:#fff3dc;margin:16px 0 12px}
.stepc p{font-size:17px;color:var(--mut);line-height:1.5}
.stepc .ok{margin-top:18px;padding-top:16px;border-top:1px solid rgba(212,175,106,.2);font-size:15.5px;color:#e6d4ae;display:flex;gap:10px;line-height:1.45}
.stepc .ok .ic{width:20px;height:20px}

.mini{display:flex;gap:16px;align-items:center;padding:18px 20px}
.mini h5{font-size:19px;font-weight:600;color:#fbf1dc}
.mini p{font-size:14.5px;color:var(--mut);margin-top:3px;line-height:1.4}
.mini .icb{width:52px;height:52px}
.mini .ic{width:26px;height:26px}

.bigstat{padding:26px 28px}
.bigstat b{display:block;font-size:52px;font-weight:600;line-height:1}
.bigstat > span{display:block;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:12px}
.bigstat em{display:block;font-style:normal;font-size:16px;color:var(--mut);margin-top:6px}

ul.bl{list-style:none;margin-top:16px}
ul.bl li{position:relative;padding-left:26px;font-size:18px;line-height:1.5;color:#d6ccbb;margin:8px 0}
ul.bl li:before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;transform:rotate(45deg);background:var(--gold)}

.tabs{display:inline-flex;padding:5px;border-radius:40px;background:rgba(20,16,10,.7);border:1px solid var(--line);gap:4px}
.tabs button{all:unset;cursor:pointer;padding:12px 26px;border-radius:30px;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#cdbfa5;font-weight:600;transition:.3s}
.tabs button.on{background:linear-gradient(100deg,#c99a4e,#f3d797);color:#1b1208}

.cp{font-weight:600}
.cp0{color:#e8d3a2} .cpx{color:#ffb39a}
td.cpcell{font-size:22px}
td.cpcell.y{background:rgba(110,46,30,.38)!important}

.wbar{display:flex;align-items:center;gap:18px;margin:14px 0}
.wbar .n{width:300px;font-size:18px;color:#ece2d0}
.wbar .n small{display:block;color:var(--dim);font-size:13.5px}
.wbar .tr{flex:1;height:14px;border-radius:10px;background:rgba(212,175,106,.1);overflow:hidden}
.wbar .tr i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#8a6125,#f2d9a2);box-shadow:0 0 14px rgba(242,217,162,.5);transition:width 1.6s var(--ease)}
.wbar .m{width:110px;text-align:right;font-weight:600;color:var(--gold2);font-size:20px}

.vbtn{all:unset;cursor:pointer;padding:14px 22px;border-radius:14px;border:1px solid var(--line);background:rgba(24,19,12,.65);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#d8cab0;font-weight:600;transition:.3s}
.vbtn.on{background:linear-gradient(100deg,#c99a4e,#f3d797);color:#1b1208;border-color:transparent;box-shadow:0 0 30px rgba(232,190,110,.35)}
.xp{width:560px;padding:28px 32px}
.xp .r{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid rgba(212,175,106,.13);font-size:17px}
.xp .r span{color:var(--mut)} .xp .r b{color:#fbf1dc;font-weight:600;text-align:right}
.xp .r b.no{color:#6f665a;font-weight:500}
.xp h3{font-size:42px;font-weight:600;line-height:1}
.xp .si{font-size:18px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;margin:10px 0 14px}
table.t.wt tr.on td{background:rgba(92,68,32,.55)}
table.t.wt tr.on td:first-child{box-shadow:inset 3px 0 0 var(--gold2)}

/* ---------- 3D photo panels ---------- */
.ph{position:absolute;perspective:1700px;z-index:1}
.ph .fr{position:relative;width:100%;height:100%;border-radius:26px;overflow:hidden;transform-style:preserve-3d;
  transform:rotateY(calc(var(--ry) + var(--mx,0) * 6deg)) rotateX(calc(var(--rx) - var(--my,0) * 4deg));
  box-shadow:0 60px 140px rgba(0,0,0,.75), 0 0 0 1px rgba(232,196,128,.5), 0 0 80px rgba(212,160,80,.18);background:#0b0907}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 18s ease-in-out infinite alternate;will-change:transform}
@keyframes kb{from{transform:scale(1.03) translate3d(0,0,0)}to{transform:scale(1.15) translate3d(-2.2%,-1.6%,0)}}
.ph .fr:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg, rgba(5,4,6,0) 45%, rgba(5,4,6,.82) 100%), radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(5,4,6,.45) 100%)}
.ph .fr:after{content:"";position:absolute;inset:-10%;z-index:2;pointer-events:none;
  background:linear-gradient(105deg, transparent 42%, rgba(255,232,190,.20) 50%, transparent 58%);background-size:260% 100%;animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,55%{background-position:140% 0}100%{background-position:-60% 0}}
.ph .cap{position:absolute;left:30px;right:30px;bottom:26px;z-index:3}
.ph .cap span{display:block;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600}
.ph .cap b{display:block;font-size:26px;font-weight:600;color:#fff5e2;margin-top:8px;line-height:1.25;text-shadow:0 2px 20px rgba(0,0,0,.8)}
.ph .edge{position:absolute;inset:0;border-radius:26px;pointer-events:none;z-index:4;border:1px solid rgba(255,222,160,.25)}
.scene.active .ph .fr{transition:transform .25s linear}

.persona.wp{padding:0;justify-content:flex-start;height:470px}
.persona.wp .pimg{position:relative;height:300px;overflow:hidden}
.persona.wp .pimg img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;animation:kb 14s ease-in-out infinite alternate}
.persona.wp .pimg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(14,11,8,.95))}
.persona.wp .pt{padding:0 26px 26px;margin-top:-34px;position:relative}
.persona.wp h4{font-size:24px;margin-top:10px}

/* ---------- story scenes ---------- */
.scap{position:absolute;left:380px;right:380px;top:842px;padding:22px 34px 22px;text-align:center}
.scap .sh{display:flex;align-items:center;justify-content:center;gap:18px}
.scap .sn{font-size:12.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600}
.scap .sd{display:flex;gap:7px}
.scap .sd i{width:26px;height:3px;border-radius:3px;background:rgba(212,175,106,.22);transition:background .5s}
.scap .sd i.on{background:linear-gradient(90deg,#c99a4e,#f3d797);box-shadow:0 0 10px rgba(242,217,162,.6)}
.scap .st{font-size:25px;line-height:1.45;color:#fbf2df;font-weight:500;margin-top:12px;min-height:72px}
.scap .rp{all:unset;cursor:pointer;position:absolute;right:20px;top:16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);padding:6px 12px;border-radius:20px;border:1px solid var(--line)}
.scap .rp:hover{background:rgba(212,175,106,.18)}
.lbl.tag .in{padding:7px 14px;border-radius:30px;font-size:16px;font-weight:600;letter-spacing:.02em;white-space:nowrap;
  background:rgba(16,12,8,.86);border:1px solid rgba(232,196,128,.55);color:#fbefd6;box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 18px rgba(212,160,80,.25)}
.lbl.tag.alert .in{border-color:rgba(255,120,95,.85);color:#ffd9cf;background:rgba(48,14,10,.9);box-shadow:0 0 22px rgba(255,90,60,.35)}
.lbl.tag.ok .in{background:linear-gradient(100deg,#c99a4e,#f3d797);color:#1b1208;border-color:transparent}
.lbl.tag.name .in{background:rgba(16,12,8,.7);font-weight:500;color:#e9dcc3}
.lbl.place{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#d8c39a;font-weight:600;text-shadow:0 2px 12px #000}
.lbl.place.big{font-size:17px;letter-spacing:.36em;color:var(--gold2)}
.shade{position:absolute;left:0;top:0;width:1300px;height:330px;pointer-events:none;background:radial-gradient(ellipse 100% 100% at 0 0, rgba(5,4,6,.82), rgba(5,4,6,0) 70%);opacity:0;transition:opacity 1s}
.scene.active .shade{opacity:1}
.scene .scap{background:linear-gradient(160deg, rgba(30,24,15,.84), rgba(10,8,6,.9))}

/* ---------- 3D explainer cards ---------- */
.vcard{position:relative;transition:border-color .5s, background .5s, transform .6s var(--ease), box-shadow .5s}
.vcard.hot{transform:translateY(-8px);box-shadow:inset 0 1px 0 rgba(255,232,190,.12), 0 30px 80px rgba(0,0,0,.5), 0 0 50px rgba(232,190,110,.16)}
.vcard.a0:before{background:linear-gradient(90deg,transparent,#5fe0d0,transparent)}
.vcard.a2:before{background:linear-gradient(90deg,transparent,#6fe89a,transparent)}
.vcap{position:absolute;left:50%;top:-20px;transform:translateX(-50%);padding:8px 20px;border-radius:30px;font-size:15.5px;font-weight:600;white-space:nowrap;z-index:2;
  background:rgba(14,18,22,.94);border:1px solid rgba(120,210,255,.6);color:#d6f1ff;box-shadow:0 8px 26px rgba(0,0,0,.6);transition:background .45s,color .45s,border-color .45s}
.vcap:empty{display:none}
.vcap.alert{background:rgba(48,14,10,.95);border-color:rgba(255,120,95,.85);color:#ffd9cf;box-shadow:0 0 22px rgba(255,90,60,.3)}
.vcap.ok{background:linear-gradient(100deg,#2f9e77,#8fe8b8);border-color:transparent;color:#052218;box-shadow:0 0 22px rgba(90,230,160,.3)}
.lbl.tag.ok .in{background:linear-gradient(100deg,#2f9e77,#8fe8b8);color:#052218}
.lbl.tag.info .in{border-color:rgba(120,210,255,.6);color:#d6f1ff;background:rgba(14,18,22,.9)}
.vcard.a3:before{background:linear-gradient(90deg,transparent,#ff8a70,transparent)}
</style>
